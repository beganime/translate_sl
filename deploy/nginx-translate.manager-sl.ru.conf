server {
    listen 80;
    listen [::]:80;
    server_name translate.manager-sl.ru;

    client_max_body_size 60M;

    location /static/ {
        alias /opt/translate-sl/staticfiles/;
        access_log off;
        expires 7d;
    }

    # There is intentionally no public /media/ location. Django checks login
    # before returning scans and generated documents.
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/translate-sl/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}
